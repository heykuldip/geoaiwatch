# The environment the post's runs used (torch and segmentation-models-pytorch as recorded
# in runs/grid_isolated/*.json). conda env create -f environment.yml, then
# conda activate geoaiwatch-near-infrared, then python -m pip install -e . from the repository root
name: geoaiwatch-near-infrared
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=1.26.4
  - pandas=2.2.2
  - pyarrow=15.0.2
  - rasterio=1.3.10
  - matplotlib=3.8.4
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.4.1
      - torchvision==0.19.1
      - segmentation-models-pytorch==0.3.4
